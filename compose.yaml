services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-screen_time_social}
      POSTGRES_USER: ${DB_USER:-screen_time_social}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-screen_time_social}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - screen-time-postgres:/var/lib/postgresql/data

  api:
    profiles: ["api"]
    build:
      context: ./server
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-screen_time_social}
      DB_USER: ${DB_USER:-screen_time_social}
      DB_PASSWORD: ${DB_PASSWORD:-screen_time_social}
      JWT_SECRET: ${JWT_SECRET:-}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-PT1H}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-P30D}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  screen-time-postgres:
