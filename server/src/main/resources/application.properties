spring.application.name=screen-time-social-api
server.port=${PORT:8080}
spring.jackson.default-property-inclusion=non_null
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:screen_time_social}
spring.datasource.username=${DB_USER:screen_time_social}
spring.datasource.password=${DB_PASSWORD:screen_time_social}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
app.security.jwt-secret=${JWT_SECRET}
app.security.access-token-ttl=${ACCESS_TOKEN_TTL:PT1H}
app.security.refresh-token-ttl=${REFRESH_TOKEN_TTL:P30D}
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.authentication-per-minute=${AUTH_RATE_LIMIT_PER_MINUTE:10}
app.rate-limit.refresh-per-minute=${REFRESH_RATE_LIMIT_PER_MINUTE:60}
app.rate-limit.search-per-minute=${SEARCH_RATE_LIMIT_PER_MINUTE:60}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
