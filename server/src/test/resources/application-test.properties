spring.datasource.url=jdbc:h2:mem:screen_time_social;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
app.security.jwt-secret=test-secret-that-is-at-least-thirty-two-bytes-long
app.security.access-token-ttl=PT1H
app.security.refresh-token-ttl=P30D
